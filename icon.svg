<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ascending progress bars -->
  <rect x="128" y="292" width="52" height="104" rx="10" fill="url(#bar)"/>
  <rect x="204" y="240" width="52" height="156" rx="10" fill="url(#bar)"/>
  <rect x="280" y="176" width="52" height="220" rx="10" fill="url(#bar)"/>

  <!-- baseline -->
  <rect x="118" y="396" width="224" height="10" rx="5" fill="#312e81"/>

  <!-- achievement badge / checkmark -->
  <circle cx="366" cy="150" r="58" fill="#fbbf24"/>
  <circle cx="366" cy="150" r="58" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M340 150l18 18 34-40" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
